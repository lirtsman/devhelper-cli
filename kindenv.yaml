tools:
    podman:
        path: /opt/homebrew/bin/podman
        version: 5.4.1
    docker:
        path: ""
        version: ""
    kind:
        path: /opt/homebrew/bin/kind
        version: version
    kubectl:
        path: /opt/homebrew/bin/kubectl
        version: ""
    helm:
        path: /opt/homebrew/bin/helm
        version: ""
    aws:
        path: /usr/local/bin/aws
        version: aws-cli/2.11.2 Python/3.11.2 Darwin/24.4.0 exe/x86_64 prompt/off
cluster:
    name: devhelper-cli
    createIfNotExists: true
    mapPorts:
        - containerPort: ${{ components.temporal.nodePorts.web }}
          hostPort: 8080
          protocol: TCP
        - containerPort: ${{ components.temporal.nodePorts.frontend }}
          hostPort: 7233
          protocol: TCP
        - containerPort: ${{ components.redis.nodePorts.redis }}
          hostPort: 6379
          protocol: TCP
components:
    temporal:
        enabled: true
        namespace: temporal
        chartVersion: 0.62.0
        nodePorts:
            web: 30080
            frontend: 30733
    redis:
        enabled: true
        nodePorts:
            redis: 30679
        chartVersion: 17.3.7
        auth:
            enabled: false
    dapr:
        enabled: true
        chartVersion: 1.15.3
        nodePorts:
            dashboard: 30479
        logLevel: debug
        mtls:
            enabled: false
        ha:
            enabled: false
    temporalWorkerOperator:
        enabled: true
        chartVersion: 0.1.46-dev
images:
    skipPull: false
    dockerHub:
        username: ""
        password: ""
    useAwsEcr: true
    aws:
        region: eu-west-1
        ecrRegistry: 992979781608.dkr.ecr.eu-west-1.amazonaws.com
        serviceAccount: ecr-pull-service-account
        profile: "shieldfc_development"
secrets:
    mysql:
        enabled: true
        name: mysql-credentials
        namespace: default
        username: root
        password: password
