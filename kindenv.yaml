tools:
  podman:
    path: /opt/homebrew/bin/podman
    version: 5.6.0
  docker:
    path: /opt/homebrew/bin/docker
    version: 29.1.5,
  kind:
    path: /opt/homebrew/bin/kind
    version: version
  kubectl:
    path: /usr/local/bin/kubectl
    version: ""
  helm:
    path: /opt/homebrew/bin/helm
    version: ""
  aws:
    path: /opt/homebrew/bin/aws
    version: aws-cli/2.27.55 Python/3.13.9 Darwin/24.6.0 source/arm64
cluster:
  name: dss-operator
  createIfNotExists: true
  mapPorts:
    - containerPort: ${{ components.openSearch.nodePorts.rest }}
      hostPort: 9200
      protocol: TCP
    - containerPort: ${{ components.openSearchDashboards.nodePorts.http }}
      hostPort: 5601
      protocol: TCP
    - containerPort: ${{ components.mysql.nodePorts.mysql }}
      hostPort: 3306
      protocol: TCP
    - containerPort: 30081
      hostPort: 8081
      protocol: TCP
    - containerPort: ${{ components.rabbitmq.nodePorts.amqp }}
      hostPort: 5672
      protocol: TCP
    - containerPort: ${{ components.rabbitmq.nodePorts.management }}
      hostPort: 15672
      protocol: TCP
components:
  temporal:
    enabled: false
    namespace: temporal
    chartVersion: 0.62.0
    nodePorts:
      web: 30080
      frontend: 30733
  redis:
    enabled: false
    nodePorts:
      redis: 30679
    chartVersion: 17.3.7
    auth:
      enabled: false
  dapr:
    enabled: false
    chartVersion: 1.15.3
    nodePorts:
      dashboard: 30479
    logLevel: debug
    mtls:
      enabled: false
    ha:
      enabled: false
  openSearch:
    enabled: true
    namespace: opensearch
    version: 2.17.1
    nodePorts:
      rest: 30920
    security:
      disabled: true
    indexManagement:
      enabled: true
  openSearchDashboards:
    enabled: true
    namespace: opensearch
    version: 2.17.1
    nodePorts:
      http: 30601
  temporalWorkerOperator:
    enabled: false
    chartVersion: 0.1.46-dev
    temporalNamespace: default
  indicesOperator:
    enabled: false
    chartVersion: 0.1.79-dev
  metricsServer:
    enabled: true
    chartVersion: 3.10.0
  keda:
    enabled: false
    namespace: keda
    chartVersion: 2.16.0
  mysql:
    enabled: true
    namespace: mysql
    chartVersion: 9.4.6
    database: mysql
    nodePorts:
      mysql: 30306
    resources:
      cpu: 500m
      memory: 1Gi
    persistence:
      enabled: false
      size: 8Gi
    initScripts:
      init-dss-databases.sql: ./scripts/init-dss-databases.sql
  rabbitmq:
    enabled: true
    namespace: rabbitmq
    chartVersion: 11.0.0
    virtualHost: /
    imageTag: "3.12-management"
    nodePorts:
      amqp: 30672
      management: 31672
    resources:
      cpu: 500m
      memory: 2Gi
    persistence:
      enabled: false
      size: 8Gi
images:
  skipPull: false
  dockerHub:
    username: ""
    password: ""
  useAwsEcr: true
  aws:
    region: eu-west-1
    ecrRegistry: 992979781608.dkr.ecr.eu-west-1.amazonaws.com
    profile: ""
  useHarbor: true
  harborRegistry: harbor.shieldfis.com
secrets:
  mysql:
    enabled: true
    name: kvv2-mysql
    namespace: default
    username: root
    password: password
  rabbitmq:
    enabled: true
    name: kvv2-rabbitmq
    namespace: default
    username: user
    password: password
customComponents:
  - name: dss
    image: 992979781608.dkr.ecr.eu-west-1.amazonaws.com/dss:dev-3846
    namespace: default
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    # Environment variables
    env:
      - name: SPRING_PROFILES_ACTIVE
        value: "local"
      - name: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://mysql.mysql.svc.cluster.local:3306/shieldcoredb"
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: kvv2-mysql
            key: username
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kvv2-mysql
            key: password
      - name: SEARCH_ENGINE_OPENSEARCH_CLUSTER_URIS
        value: "http://opensearch.opensearch.svc.cluster.local:9200"
      - name: SEARCH_ENGINE_OPENSEARCH_CLUSTER_USERNAME
        value: "admin"
      - name: SEARCH_ENGINE_OPENSEARCH_CLUSTER_PASSWORD
        value: "admin"
      - name: SERVER_PORT
        value: "8081"
    ports:
      - containerPort: 8081
        protocol: TCP
        nodePort: 30081
