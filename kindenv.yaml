tools:
    podman:
        path: /opt/homebrew/bin/podman
        version: 5.4.1
    docker:
        path: ""
        version: ""
    kind:
        path: /opt/homebrew/bin/kind
        version: version
    kubectl:
        path: /opt/homebrew/bin/kubectl
        version: ""
    helm:
        path: /opt/homebrew/bin/helm
        version: ""
    aws:
        path: /usr/local/bin/aws
        version: aws-cli/2.11.2 Python/3.11.2 Darwin/24.4.0 exe/x86_64 prompt/off
cluster:
    name: kindenv
    createIfNotExists: true
    mapPorts:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
        - containerPort: 443
          hostPort: 443
          protocol: TCP
components:
    temporal:
        enabled: true
        namespace: temporal
        webPort: 8080
        webNodePort: 30080
        frontendPort: 7233
        frontendNodePort: 30733
    redis:
        enabled: true
        port: 6379
        nodePort: 30679
        chartVersion: 17.3.7
        auth:
            enabled: false
    dapr:
        enabled: true
        version: 1.15.3
        logLevel: debug
        mtls:
            enabled: false
        ha:
            enabled: false
images:
    skipPull: false
    dockerHub:
        username: ""
        password: ""
    useAwsEcr: false
    aws:
        region: eu-west-1
        ecrRegistry: ""
        serviceAccount: ecr-pull-service-account
secrets:
    mysql:
        enabled: true
        name: mysql-credentials
        namespace: default
        username: root
        password: password
