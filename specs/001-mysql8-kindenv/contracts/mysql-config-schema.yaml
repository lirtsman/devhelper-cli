# MySQL Configuration Schema for KindEnv
# This schema defines the structure for MySQL configuration in kindenv.yaml

mysql_component_config:
  type: object
  properties:
    enabled:
      type: boolean
      default: false
      description: "Enable or disable MySQL deployment in kindenv"
    
    chartVersion:
      type: string
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      default: "9.4.6"
      description: "Bitnami MySQL Helm chart version"
    
    database:
      type: string
      pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,63}$"
      default: "mysql"
      description: "Default database name to create"
    
    nodePorts:
      type: object
      properties:
        mysql:
          type: integer
          minimum: 30000
          maximum: 32767
          default: 30306
          description: "NodePort for MySQL service"
      required: ["mysql"]
    
    resources:
      type: object
      properties:
        cpu:
          type: string
          pattern: "^[0-9]+m?$"
          default: "500m"
          description: "CPU resource limit (e.g., 500m, 1)"
        
        memory:
          type: string
          pattern: "^[0-9]+[KMGT]i$"
          default: "1Gi"
          description: "Memory resource limit (e.g., 1Gi, 512Mi)"
      required: ["cpu", "memory"]
    
    persistence:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: "Enable persistent storage for MySQL data"
        
        size:
          type: string
          pattern: "^[0-9]+[KMGT]i$"
          default: "8Gi"
          description: "Persistent volume size (e.g., 8Gi, 10Gi)"
      required: ["enabled", "size"]
  
  required: ["enabled"]

mysql_secret_config:
  type: object
  properties:
    enabled:
      type: boolean
      default: false
      description: "Enable MySQL secret creation"
    
    name:
      type: string
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      default: "mysql-credentials"
      description: "Kubernetes secret name"
    
    namespace:
      type: string
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      default: "mysql"
      description: "Kubernetes namespace for secret"
    
    username:
      type: string
      pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,31}$"
      default: "root"
      description: "MySQL username"
    
    password:
      type: string
      minLength: 1
      default: "password"
      description: "MySQL password"
  
  required: ["enabled", "name", "namespace", "username", "password"]

# Complete kindenv.yaml structure with MySQL
kindenv_config_with_mysql:
  type: object
  properties:
    components:
      type: object
      properties:
        mysql:
          $ref: "#/mysql_component_config"
    
    secrets:
      type: object
      properties:
        mysql:
          $ref: "#/mysql_secret_config"