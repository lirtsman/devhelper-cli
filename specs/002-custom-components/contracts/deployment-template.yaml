# Kubernetes Deployment, Service, and ConfigMap Template for Custom Components
# This template shows the structure of Kubernetes resources generated for custom components

---
# ConfigMap Resource (if configFiles are specified)
{{- if .ConfigFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Name }}-config
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
    managed-by: kindenv
    component-type: custom
data:
  {{- range .ConfigFiles }}
  {{ .Name }}: |
{{ .Contents | indent 4 }}
  {{- end }}
---
{{- end }}

# Deployment Resource
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
    managed-by: kindenv
    component-type: custom
    {{- range $key, $value := .Labels }}
    {{ $key }}: {{ $value }}
    {{- end }}
  {{- if .Annotations }}
  annotations:
    {{- range $key, $value := .Annotations }}
    {{ $key }}: {{ $value }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ .Replicas }}
  selector:
    matchLabels:
      app: {{ .Name }}
      managed-by: kindenv
  template:
    metadata:
      labels:
        app: {{ .Name }}
        managed-by: kindenv
        component-type: custom
        {{- range $key, $value := .Labels }}
        {{ $key }}: {{ $value }}
        {{- end }}
    spec:
      {{- if .ImagePullSecrets }}
      imagePullSecrets:
        {{- range .ImagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .ConfigFiles }}
      volumes:
        - name: {{ .Name }}-config-volume
          configMap:
            name: {{ .Name }}-config
            defaultMode: 0644
      {{- end }}
      containers:
        - name: {{ .Name }}
          image: {{ .Image }}
          {{- if .Command }}
          command:
            {{- range .Command }}
            - {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Args }}
          args:
            {{- range .Args }}
            - {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Env }}
          env:
            {{- range .Env }}
            - name: {{ .Name }}
              {{- if .Value }}
              value: {{ .Value | quote }}
              {{- else if .ValueFrom }}
              valueFrom:
                {{- if .ValueFrom.SecretKeyRef }}
                secretKeyRef:
                  name: {{ .ValueFrom.SecretKeyRef.Name }}
                  key: {{ .ValueFrom.SecretKeyRef.Key }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Ports }}
          ports:
            {{- range .Ports }}
            - name: port-{{ .ContainerPort }}
              containerPort: {{ .ContainerPort }}
              protocol: {{ .Protocol | default "TCP" }}
            {{- end }}
          {{- end }}
          {{- if .ConfigFiles }}
          volumeMounts:
            {{- range .ConfigFiles }}
            - name: {{ $.Name }}-config-volume
              mountPath: {{ .Path }}
              subPath: {{ .Name }}
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if or .Resources.Requests .Resources.Limits }}
          resources:
            {{- if .Resources.Requests }}
            requests:
              {{- if .Resources.Requests.CPU }}
              cpu: {{ .Resources.Requests.CPU }}
              {{- end }}
              {{- if .Resources.Requests.Memory }}
              memory: {{ .Resources.Requests.Memory }}
              {{- end }}
            {{- end }}
            {{- if .Resources.Limits }}
            limits:
              {{- if .Resources.Limits.CPU }}
              cpu: {{ .Resources.Limits.CPU }}
              {{- end }}
              {{- if .Resources.Limits.Memory }}
              memory: {{ .Resources.Limits.Memory }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- if .ReadinessProbe }}
          readinessProbe:
            {{- if .ReadinessProbe.HTTPGet }}
            httpGet:
              path: {{ .ReadinessProbe.HTTPGet.Path }}
              port: {{ .ReadinessProbe.HTTPGet.Port }}
              scheme: {{ .ReadinessProbe.HTTPGet.Scheme | default "HTTP" }}
            {{- end }}
            {{- if .ReadinessProbe.TCPSocket }}
            tcpSocket:
              port: {{ .ReadinessProbe.TCPSocket.Port }}
            {{- end }}
            initialDelaySeconds: {{ .ReadinessProbe.InitialDelaySeconds | default 5 }}
            periodSeconds: {{ .ReadinessProbe.PeriodSeconds | default 10 }}
            timeoutSeconds: {{ .ReadinessProbe.TimeoutSeconds | default 1 }}
            successThreshold: {{ .ReadinessProbe.SuccessThreshold | default 1 }}
            failureThreshold: {{ .ReadinessProbe.FailureThreshold | default 3 }}
          {{- end }}
          {{- if .LivenessProbe }}
          livenessProbe:
            {{- if .LivenessProbe.HTTPGet }}
            httpGet:
              path: {{ .LivenessProbe.HTTPGet.Path }}
              port: {{ .LivenessProbe.HTTPGet.Port }}
              scheme: {{ .LivenessProbe.HTTPGet.Scheme | default "HTTP" }}
            {{- end }}
            {{- if .LivenessProbe.TCPSocket }}
            tcpSocket:
              port: {{ .LivenessProbe.TCPSocket.Port }}
            {{- end }}
            initialDelaySeconds: {{ .LivenessProbe.InitialDelaySeconds | default 15 }}
            periodSeconds: {{ .LivenessProbe.PeriodSeconds | default 10 }}
            timeoutSeconds: {{ .LivenessProbe.TimeoutSeconds | default 1 }}
            successThreshold: {{ .LivenessProbe.SuccessThreshold | default 1 }}
            failureThreshold: {{ .LivenessProbe.FailureThreshold | default 3 }}
          {{- end }}
      restartPolicy: Always

---
# Service Resource (NodePort for external access)
{{- if .Ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .ServiceName | default (printf "%s-service" .Name) }}
  namespace: {{ .Namespace }}
  labels:
    app: {{ .Name }}
    managed-by: kindenv
    component-type: custom
  {{- if .Annotations }}
  annotations:
    {{- range $key, $value := .Annotations }}
    {{ $key }}: {{ $value }}
    {{- end }}
  {{- end }}
spec:
  type: NodePort
  selector:
    app: {{ .Name }}
    managed-by: kindenv
  ports:
    {{- range .Ports }}
    - name: port-{{ .ContainerPort }}
      protocol: {{ .Protocol | default "TCP" }}
      port: {{ .ContainerPort }}
      targetPort: {{ .ContainerPort }}
      {{- if .NodePort }}
      nodePort: {{ .NodePort }}
      {{- end }}
    {{- end }}
{{- end }}

---
# Example: Concrete manifest for a Spring Boot application with ConfigMap

apiVersion: v1
kind: ConfigMap
metadata:
  name: my-spring-app-config
  namespace: default
  labels:
    app: my-spring-app
    managed-by: kindenv
    component-type: custom
data:
  application.yaml: |
    server:
      port: 8080
    spring:
      application:
        name: my-spring-app
      datasource:
        url: jdbc:mysql://mysql.mysql.svc.cluster.local:3306/mydb
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics
  
  logback.xml: |
    <configuration>
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
        </encoder>
      </appender>
      <root level="INFO">
        <appender-ref ref="STDOUT" />
      </root>
    </configuration>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-spring-app
  namespace: default
  labels:
    app: my-spring-app
    managed-by: kindenv
    component-type: custom
    tier: backend
    version: v1.2.3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-spring-app
      managed-by: kindenv
  template:
    metadata:
      labels:
        app: my-spring-app
        managed-by: kindenv
        component-type: custom
        tier: backend
    spec:
      imagePullSecrets:
        - name: ecr-credentials
      volumes:
        - name: my-spring-app-config-volume
          configMap:
            name: my-spring-app-config
            defaultMode: 0644
      containers:
        - name: my-spring-app
          image: 992979781608.dkr.ecr.eu-west-1.amazonaws.com/my-spring-app:v1.2.3
          command: ["java"]
          args: ["-jar", "/app/application.jar", "--spring.config.location=file:/config/application.yaml"]
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql.mysql.svc.cluster.local:3306/shieldcoredb"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: SEARCH_ENGINE_OPENSEARCH_CLUSTER_URIS
              value: "https://opensearch.opensearch.svc.cluster.local:9200"
            - name: SEARCH_ENGINE_OPENSEARCH_CLUSTER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: username
            - name: SEARCH_ENGINE_OPENSEARCH_CLUSTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-secret
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: my-spring-app-config-volume
              mountPath: /config/application.yaml
              subPath: application.yaml
              readOnly: true
            - name: my-spring-app-config-volume
              mountPath: /config/logback.xml
              subPath: logback.xml
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: my-spring-app-service
  namespace: default
  labels:
    app: my-spring-app
    managed-by: kindenv
    component-type: custom
spec:
  type: NodePort
  selector:
    app: my-spring-app
    managed-by: kindenv
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30800

---
# Example: Minimal deployment with defaults

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: default
  labels:
    app: nginx-test
    managed-by: kindenv
    component-type: custom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-test
      managed-by: kindenv
  template:
    metadata:
      labels:
        app: nginx-test
        managed-by: kindenv
        component-type: custom
    spec:
      containers:
        - name: nginx-test
          image: nginx:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test-service
  namespace: default
  labels:
    app: nginx-test
    managed-by: kindenv
    component-type: custom
spec:
  type: NodePort
  selector:
    app: nginx-test
    managed-by: kindenv
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
